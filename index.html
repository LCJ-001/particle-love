<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子之恋 - 3D Particle Love</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none; -webkit-user-select: none;
    height: 100dvh; width: 100dvw;
  }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; z-index: 100; background: #050510;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading-text {
    color: #ff6b9d; font-size: 1.3rem; letter-spacing: 0.15em;
    animation: pulse 1.5s ease-in-out infinite;
  }
  #loading-sub { color: #ff8fab80; font-size: 0.85rem; margin-top: 10px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  #ui {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    padding: 16px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
    background: linear-gradient(transparent, rgba(5,5,16,0.85) 40%);
  }
  #gesture-label {
    color: #fff; font-size: 1.1rem; letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(255,107,157,0.6); transition: all 0.3s;
  }
  #gesture-label.active { color: #ff6b9d; font-size: 1.4rem; }
  #openness-bar-wrap {
    width: 200px; height: 4px; background: rgba(255,255,255,0.15);
    border-radius: 2px; overflow: hidden;
  }
  #openness-bar {
    height: 100%; background: linear-gradient(90deg, #ff6b9d, #ffd166);
    border-radius: 2px; transition: width 0.15s;
  }

  #video-preview {
    position: fixed; bottom: 20px; right: 20px; z-index: 10;
    width: 140px; height: 105px; border-radius: 12px;
    border: 2px solid rgba(255,107,157,0.4);
    object-fit: cover; transform: scaleX(-1);
    opacity: 0.6; transition: opacity 0.4s;
  }
  #video-preview:hover { opacity: 1; }

  #hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(255,255,255,0.5); font-size: 0.78rem;
    pointer-events: none; transition: opacity 0.5s;
  }

  #loading-progress-wrap {
    width: 220px; height: 3px; background: rgba(255,255,255,0.1);
    border-radius: 2px; margin-top: 14px; overflow: hidden;
  }
  #loading-progress {
    height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b9d, #ffd166);
    border-radius: 2px; transition: width 0.3s;
  }

  #music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid rgba(255,107,157,0.5);
    background: rgba(10,5,20,0.7); color: #ff6b9d;
    font-size: 1.1rem; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  #music-btn:hover { border-color: #ff6b9d; box-shadow: 0 0 16px rgba(255,107,157,0.4); }
  #music-btn.off { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.2); }

  #local-music-hint {
    position: fixed; top: 60px; right: 10px; z-index: 20;
    color: rgba(255,255,255,0.35); font-size: 0.7rem;
    pointer-events: none; text-align: right; line-height: 1.4;
  }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-text">正在加载手势识别模型…</div>
  <div id="loading-sub">模型约 18MB，首次加载需耐心等待</div>
  <div id="loading-progress-wrap"><div id="loading-progress"></div></div>
</div>

<button id="music-btn" title="音乐">♪</button>
<div id="local-music-hint"></div>

<video id="input-video" autoplay playsinline muted style="display:none"></video>

<div id="ui">
  <div id="gesture-label">等待手势…</div>
  <div id="openness-bar-wrap"><div id="openness-bar" style="width:50%"></div></div>
</div>

<div id="hint">按 0/1/2/3/4/5 切换形态 &nbsp;|&nbsp; 滑动鼠标控制张合</div>

<script src="js/three.min.js"></script>
<script src="js/camera_utils.js"></script>
<script src="js/hands.js"></script>

<script>
// ================================================================
// 1. 配置
// ================================================================
const CONFIG = {
  particleCount: 10000,
  sphereRadius: 3,
  textWidth: 5.5,
  textHeight: 2.8,
  transitionSpeed: 4.5,
  cameraZ: 9,
  opennessSmoothing: 0.45,
  landmarkSmoothing: 0.55,
  gestureDebounceFrames: 5,
  colorPulseSpeed: 2.5,
  glowIntensity: 1.4,
  modelLoadTimeout: 30,
  // 手部跟随灵敏度
  handFollowSpeed: 0.08,
};

// ================================================================
// 2. Three.js 初始化
// ================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 50);
camera.position.set(0, 0, CONFIG.cameraZ);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

// 发光粒子贴图
function createGlowTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.06, 'rgba(255,240,245,0.95)');
  g.addColorStop(0.2, 'rgba(255,150,180,0.7)');
  g.addColorStop(0.5, 'rgba(255,80,120,0.15)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

// 粉色 + 蓝调固定调色板
const pinkBluePalette = [
  // 粉色系
  '#ff6b9d', '#ff8fab', '#ffb3c6', '#ff477e',
  '#ff3366', '#ff7096', '#ffc2d1', '#ff4081',
  '#ff5e8a', '#ff9f9f', '#ffb8c6', '#ffccd5',
  // 蓝调系
  '#6ba3ff', '#8fb3ff', '#b3d4ff', '#477eff',
  '#6699ff', '#c2d6ff', '#4080ff', '#9fc5ff',
  '#7ba8ff', '#a3c4ff', '#5b8def', '#88a8ff',
  // 粉蓝过渡
  '#d47fff', '#ff7bd4', '#b37fff', '#c48fff',
  '#e090ff', '#f090e0', '#d080f0', '#e880d0',
];

function paletteColor(hex) {
  return new THREE.Color(hex);
}

// 粒子几何体
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(CONFIG.particleCount * 3);
const baseColors = new Float32Array(CONFIG.particleCount * 3);
const colors = new Float32Array(CONFIG.particleCount * 3);
const sizes = new Float32Array(CONFIG.particleCount);

// 每颗粒子的基础颜色索引
const baseColorIndices = new Uint16Array(CONFIG.particleCount);

for (let i = 0; i < CONFIG.particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = CONFIG.sphereRadius * (0.6 + Math.random() * 0.4);
  positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
  positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
  positions[i * 3 + 2] = Math.cos(phi) * r;

  const colorIdx = Math.floor(Math.random() * pinkBluePalette.length);
  baseColorIndices[i] = colorIdx;
  const col = paletteColor(pinkBluePalette[colorIdx]);
  baseColors[i * 3] = col.r;
  baseColors[i * 3 + 1] = col.g;
  baseColors[i * 3 + 2] = col.b;
  colors[i * 3] = col.r;
  colors[i * 3 + 1] = col.g;
  colors[i * 3 + 2] = col.b;

  sizes[i] = 0.02 + Math.random() * 0.08;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.10,
  map: createGlowTexture(),
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.85,
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// 背景星场
const starsGeo = new THREE.BufferGeometry();
const starsCount = 1200;
const starsPos = new Float32Array(starsCount * 3);
const starsBaseCol = new Float32Array(starsCount * 3);
const starsCol = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount; i++) {
  starsPos[i * 3] = (Math.random() - 0.5) * 30;
  starsPos[i * 3 + 1] = (Math.random() - 0.5) * 20;
  starsPos[i * 3 + 2] = -5 - Math.random() * 15;
  const brightness = 0.3 + Math.random() * 0.7;
  const col = paletteColor(pinkBluePalette[Math.floor(Math.random() * pinkBluePalette.length)]);
  starsBaseCol[i * 3] = col.r * brightness * 0.5;
  starsBaseCol[i * 3 + 1] = col.g * brightness * 0.5;
  starsBaseCol[i * 3 + 2] = col.b * brightness * 0.5;
  starsCol[i * 3] = starsBaseCol[i * 3];
  starsCol[i * 3 + 1] = starsBaseCol[i * 3 + 1];
  starsCol[i * 3 + 2] = starsBaseCol[i * 3 + 2];
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
starsGeo.setAttribute('color', new THREE.BufferAttribute(starsCol, 3));
const starsMat = new THREE.PointsMaterial({
  size: 0.025, vertexColors: true,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55,
});
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// 环境光点
const auraGeo = new THREE.BufferGeometry();
const auraCount = 300;
const auraPos = new Float32Array(auraCount * 3);
const auraColArr = new Float32Array(auraCount * 3);
for (let i = 0; i < auraCount; i++) {
  auraPos[i * 3] = (Math.random() - 0.5) * 12;
  auraPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
  auraPos[i * 3 + 2] = (Math.random() - 0.5) * 4;
  const col = paletteColor(pinkBluePalette[Math.floor(Math.random() * pinkBluePalette.length)]);
  auraColArr[i * 3] = col.r;
  auraColArr[i * 3 + 1] = col.g;
  auraColArr[i * 3 + 2] = col.b;
}
auraGeo.setAttribute('position', new THREE.BufferAttribute(auraPos, 3));
auraGeo.setAttribute('color', new THREE.BufferAttribute(auraColArr, 3));
const auraMat = new THREE.PointsMaterial({
  size: 0.06, vertexColors: true,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.25,
});
const aura = new THREE.Points(auraGeo, auraMat);
scene.add(aura);

// 保存光环基础颜色（用于脉动）
const baseAuraColors = new Float32Array(auraColArr);

// ================================================================
// 3. 文字采样（更高分辨率 + 更多采样点）
// ================================================================
function sampleTextPositions(text, fontSize, canvasW, canvasH, count) {
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "SimHei", "Noto Sans SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvasW / 2, canvasH / 2);

  const imageData = ctx.getImageData(0, 0, canvasW, canvasH);
  const data = imageData.data;
  const litPixels = [];

  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] > 80) {
      litPixels.push({ x: (i / 4) % canvasW, y: Math.floor((i / 4) / canvasW) });
    }
  }

  if (litPixels.length < 10) {
    console.warn('文字采样像素不足:', text);
    return Array.from({ length: count }, () => ({
      x: (Math.random() - 0.5) * 2,
      y: (Math.random() - 0.5) * 2,
      z: (Math.random() - 0.5) * 0.3,
    }));
  }

  const samples = [];
  for (let i = 0; i < count; i++) {
    const p = litPixels[Math.floor(Math.random() * litPixels.length)];
    samples.push({
      x: (p.x / canvasW - 0.5) * 2,
      y: -(p.y / canvasH - 0.5) * 2,
      z: (Math.random() - 0.5) * 0.25,
    });
  }
  return samples;
}

const loveTargets = sampleTextPositions('爱你', 160, 900, 220, CONFIG.particleCount);
const foreverTargets = sampleTextPositions('永远爱你', 110, 1000, 220, CONFIG.particleCount);

// ---- 羽毛球形状 ----
function drawShuttlecock(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2;

  ctx.fillStyle = '#ffffff';
  // 球头（半圆）
  ctx.beginPath();
  ctx.arc(cx, 60, 42, Math.PI, 0);
  ctx.fill();
  // 球头底部横条
  ctx.fillRect(cx - 42, 58, 84, 12);

  // 羽毛裙身（梯形）
  ctx.beginPath();
  ctx.moveTo(cx - 42, 70);
  ctx.lineTo(cx - 80, h - 20);
  ctx.lineTo(cx + 80, h - 20);
  ctx.lineTo(cx + 42, 70);
  ctx.fill();

  // 羽毛纹理线
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 12, 78);
    ctx.lineTo(cx + i * 28, h - 28);
    ctx.stroke();
  }
  // 横纹
  ctx.lineWidth = 2;
  for (let j = 0; j < 3; j++) {
    const y = 110 + j * 45;
    ctx.beginPath();
    ctx.moveTo(cx - 60 + j * 5, y);
    ctx.lineTo(cx + 60 - j * 5, y);
    ctx.stroke();
  }
}

// ---- 尤尼克斯羽毛球拍形状 ----
function drawRacket(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2;

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#ffffff';

  // 拍头椭圆
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.ellipse(cx, 130, 85, 110, 0, 0, Math.PI * 2);
  ctx.stroke();

  // 拍头填充（网格感）
  ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 20, 40);
    ctx.lineTo(cx + i * 15, 220);
    ctx.stroke();
  }
  for (let j = -2; j <= 2; j++) {
    ctx.beginPath();
    ctx.moveTo(cx - 70, 130 + j * 35);
    ctx.lineTo(cx + 70, 130 + j * 30);
    ctx.stroke();
  }

  // 拍杆
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(cx, 235);
  ctx.lineTo(cx, 340);
  ctx.stroke();

  // 拍柄
  ctx.fillRect(cx - 18, 340, 36, 90);
  // 柄部纹路
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(cx - 18, 355 + k * 20);
    ctx.lineTo(cx + 18, 355 + k * 20);
    ctx.stroke();
  }
}

// ---- 情侣拥抱形状 ----
function drawHuggingCouple(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2;

  ctx.fillStyle = '#ffffff';

  // 左人头
  ctx.beginPath();
  ctx.arc(cx - 55, 60, 32, 0, Math.PI * 2);
  ctx.fill();
  // 右人头（略高）
  ctx.beginPath();
  ctx.arc(cx + 50, 50, 30, 0, Math.PI * 2);
  ctx.fill();

  // 中间爱心
  ctx.beginPath();
  const hx = cx, hy = 85;
  ctx.moveTo(hx, hy + 18);
  ctx.bezierCurveTo(hx - 24, hy - 5, hx - 12, hy - 28, hx, hy - 8);
  ctx.bezierCurveTo(hx + 12, hy - 28, hx + 24, hy - 5, hx, hy + 18);
  ctx.fill();

  // 左身体
  ctx.beginPath();
  ctx.moveTo(cx - 80, 95);
  ctx.quadraticCurveTo(cx - 40, 170, cx - 10, h - 15);
  ctx.lineTo(cx - 55, h - 15);
  ctx.quadraticCurveTo(cx - 80, 170, cx - 95, 95);
  ctx.fill();

  // 右身体
  ctx.beginPath();
  ctx.moveTo(cx + 75, 90);
  ctx.quadraticCurveTo(cx + 35, 165, cx + 8, h - 10);
  ctx.lineTo(cx + 60, h - 10);
  ctx.quadraticCurveTo(cx + 85, 165, cx + 95, 90);
  ctx.fill();

  // 环抱手臂（弧形连接两人）
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(cx, 125, 55, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(cx, 125, 50, -0.85 * Math.PI, -0.15 * Math.PI);
  ctx.stroke();
}

// 通用形状采样函数
function sampleShape(drawFn, canvasW, canvasH, count) {
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  drawFn(canvas);

  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvasW, canvasH);
  const data = imageData.data;
  const litPixels = [];

  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] > 60) {
      litPixels.push({ x: (i / 4) % canvasW, y: Math.floor((i / 4) / canvasW) });
    }
  }

  if (litPixels.length < 10) {
    console.warn('形状采样像素不足');
    return Array.from({ length: count }, () => ({
      x: (Math.random() - 0.5) * 2,
      y: (Math.random() - 0.5) * 2,
      z: (Math.random() - 0.5) * 0.3,
    }));
  }

  const samples = [];
  for (let i = 0; i < count; i++) {
    const p = litPixels[Math.floor(Math.random() * litPixels.length)];
    samples.push({
      x: (p.x / canvasW - 0.5) * 2,
      y: -(p.y / canvasH - 0.5) * 2,
      z: (Math.random() - 0.5) * 0.25,
    });
  }
  return samples;
}

const shuttlecockTargets = sampleShape(drawShuttlecock, 400, 380, CONFIG.particleCount);
const racketTargets = sampleShape(drawRacket, 360, 460, CONFIG.particleCount);
const hugTargets = sampleShape(drawHuggingCouple, 440, 380, CONFIG.particleCount);

// Fibonacci 球面
function fibonacciSphere(count) {
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = phi * i;
    points.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r });
  }
  return points;
}
const sphereBase = fibonacciSphere(CONFIG.particleCount);

// 每颗粒子独立的过渡速度 + 个性参数
const particleSpeeds = new Float32Array(CONFIG.particleCount);
const particlePhases = new Float32Array(CONFIG.particleCount);
const sparkleTimers = new Float32Array(CONFIG.particleCount);
for (let i = 0; i < CONFIG.particleCount; i++) {
  particleSpeeds[i] = CONFIG.transitionSpeed * (0.4 + Math.random() * 1.2);
  particlePhases[i] = Math.random() * Math.PI * 2;
  sparkleTimers[i] = Math.random() * 100;
}

// ================================================================
// 4. 手势平滑系统 + 手部位置追踪
// ================================================================
let rawGesture = 0;
let rawOpenness = 0.5;
let handDetected = false;
let useCamera = false;

let smoothGesture = 0;
let smoothOpenness = 0.5;

// 手部中心位置（归一化坐标 0-1，平滑后）
let handCenterX = 0.5;
let handCenterY = 0.5;
let smoothHandX = 0.5;
let smoothHandY = 0.5;
let smoothHandZ = 0;

const gestureVotes = [0, 0, 0, 0, 0, 0];
const GESTURE_VOTE_DECAY = 0.75;
const GESTURE_SWITCH_THRESHOLD = 2.5;

let smoothedLandmarks = null;

function smoothLandmarks(rawLandmarks) {
  if (!smoothedLandmarks || smoothedLandmarks.length !== rawLandmarks.length) {
    smoothedLandmarks = rawLandmarks.map(l => ({ ...l }));
    return smoothedLandmarks;
  }
  const a = CONFIG.landmarkSmoothing;
  for (let i = 0; i < rawLandmarks.length; i++) {
    smoothedLandmarks[i].x += (rawLandmarks[i].x - smoothedLandmarks[i].x) * a;
    smoothedLandmarks[i].y += (rawLandmarks[i].y - smoothedLandmarks[i].y) * a;
    smoothedLandmarks[i].z += (rawLandmarks[i].z - smoothedLandmarks[i].z) * a;
  }
  return smoothedLandmarks;
}

function detectGesture(landmarks) {
  const fingers = [
    { tip: 8, pip: 6 },
    { tip: 12, pip: 10 },
    { tip: 16, pip: 14 },
    { tip: 20, pip: 18 },
  ];
  const extended = fingers.map(f => landmarks[f.tip].y < landmarks[f.pip].y - 0.015);

  const count = extended.filter(Boolean).length;

  // 拇指检测：拇指尖 x 明显偏离食指根部（selfieMode 下镜像坐标）
  const thumbTip = landmarks[4];
  const thumbIp = landmarks[3];
  const thumbExtended = thumbTip.x < thumbIp.x - 0.02;

  if (count === 1 && extended[0]) return 1;
  if (count === 2 && extended[0] && extended[1]) return 2;
  if (count === 3 && extended[0] && extended[1] && extended[2]) return 3;
  if (count === 4 && extended[0] && extended[1] && extended[2] && extended[3]) {
    return thumbExtended ? 5 : 4;
  }
  return 0;
}

function calcOpenness(landmarks) {
  const thumb = landmarks[4];
  const pinky = landmarks[20];
  const dist = Math.hypot(thumb.x - pinky.x, thumb.y - pinky.y, thumb.z - pinky.z);
  return Math.max(0, Math.min(1, (dist - 0.08) / 0.32));
}

function updateGestureVote(raw) {
  for (let i = 0; i < 6; i++) gestureVotes[i] *= GESTURE_VOTE_DECAY;
  gestureVotes[raw] += 1.2;

  const maxVote = Math.max(...gestureVotes);
  const maxGesture = gestureVotes.indexOf(maxVote);

  if (maxGesture !== smoothGesture && maxVote >= GESTURE_SWITCH_THRESHOLD) {
    smoothGesture = maxGesture;
    for (let i = 0; i < 6; i++) gestureVotes[i] = 0;
    gestureVotes[maxGesture] = GESTURE_SWITCH_THRESHOLD;
  }

  if (smoothGesture > 0 && gestureVotes[smoothGesture] < 1.0 && maxVote < 1.5) {
    smoothGesture = 0;
    for (let i = 0; i < 6; i++) gestureVotes[i] = 0;
  }
}

function onHandResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handDetected = true;
    const raw = results.multiHandLandmarks[0];
    const smoothed = smoothLandmarks(raw);

    rawGesture = detectGesture(smoothed);
    rawOpenness = calcOpenness(smoothed);

    updateGestureVote(rawGesture);
    smoothOpenness += (rawOpenness - smoothOpenness) * CONFIG.opennessSmoothing;

    // 手部中心追踪（使用手腕 landmark 0 + 中指根部 landmark 9 的平均）
    handCenterX = (smoothed[0].x + smoothed[9].x) / 2;
    handCenterY = (smoothed[0].y + smoothed[9].y) / 2;
    // Z 深度（拇指与食指指尖中点近似）
    const handZ = (smoothed[4].z + smoothed[8].z) / 2;
    smoothHandZ += (handZ - smoothHandZ) * 0.3;
  } else {
    handDetected = false;
    if (!useCamera) return;
    smoothOpenness += (0.5 - smoothOpenness) * 0.05;
    for (let i = 0; i < 6; i++) gestureVotes[i] *= 0.8;
    if (Math.max(...gestureVotes) < 1.5) smoothGesture = 0;
    // 手离开时缓慢回到中心
    handCenterX = 0.5;
    handCenterY = 0.5;
  }

  // 平滑手部位置
  const f = CONFIG.handFollowSpeed;
  smoothHandX += (handCenterX - smoothHandX) * f;
  smoothHandY += (handCenterY - smoothHandY) * f;
}

// ================================================================
// 5. MediaPipe 初始化
// ================================================================
async function initMediaPipe() {
  const loadingText = document.getElementById('loading-text');
  const loadingSub = document.getElementById('loading-sub');
  const progressBar = document.getElementById('loading-progress');

  if (typeof Hands === 'undefined') {
    loadingText.textContent = '手势库未加载，使用键盘模式';
    loadingSub.textContent = '按 0-5 切换形态，滑动鼠标控制张合';
    progressBar.style.width = '100%';
    return false;
  }

  let progress = 0;
  const progressTimer = setInterval(() => {
    progress += Math.random() * 8;
    if (progress > 85) progress = 85;
    progressBar.style.width = progress + '%';
  }, 400);

  loadingText.textContent = '加载手势识别模型中…';
  loadingSub.textContent = '模型约 18MB，请耐心等待（首次约需 5-30 秒）';

  const hands = new Hands({
    locateFile: (file) => {
      return `models/${file}`;
    },
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.4,
    selfieMode: true,
  });

  hands.onResults(onHandResults);

  const video = document.getElementById('input-video');

  const timeoutPromise = new Promise((resolve) => {
    setTimeout(() => {
      clearInterval(progressTimer);
      progressBar.style.width = '100%';
      loadingText.textContent = '模型加载超时，使用键盘模式';
      loadingSub.textContent = '按 0-5 切换形态，模型将在后台继续加载';
      resolve(false);
    }, CONFIG.modelLoadTimeout * 1000);
  });

  const cameraPromise = (async () => {
    try {
      loadingSub.textContent = '正在加载模型文件…';

      // 显式初始化，触发模型下载和 WASM 编译
      await hands.initialize();

      loadingSub.textContent = '正在请求摄像头权限…';

      // Camera 内部会调用 getUserMedia，不要手动获取
      const cameraUtil = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640, height: 480,
      });
      await cameraUtil.start();

      // 从 Camera 获取已在播放的流来创建预览
      const stream = video.srcObject;
      if (stream) {
        const preview = document.createElement('video');
        preview.id = 'video-preview';
        preview.srcObject = stream;
        preview.autoplay = true;
        preview.playsInline = true;
        preview.muted = true;
        document.body.appendChild(preview);
      }

      clearInterval(progressTimer);
      progressBar.style.width = '100%';
      return true;
    } catch (e) {
      clearInterval(progressTimer);
      progressBar.style.width = '100%';
      loadingText.textContent = '摄像头不可用，使用键盘模式';
      loadingSub.textContent = '按 0-5 切换形态，滑动鼠标控制张合';
      console.warn('摄像头不可用:', e.message);
      return false;
    }
  })();

  return Promise.race([cameraPromise, timeoutPromise]);
}

// ================================================================
// 6. 后备控制
// ================================================================
function setupFallback() {
  document.addEventListener('keydown', (e) => {
    if (e.key === '0') { smoothGesture = 0; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; }
    if (e.key === '1') { smoothGesture = 1; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; gestureVotes[1] = 10; }
    if (e.key === '2') { smoothGesture = 2; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; gestureVotes[2] = 10; }
    if (e.key === '3') { smoothGesture = 3; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; gestureVotes[3] = 10; }
    if (e.key === '4') { smoothGesture = 4; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; gestureVotes[4] = 10; }
    if (e.key === '5') { smoothGesture = 5; for (let i = 0; i < 6; i++) gestureVotes[i] = 0; gestureVotes[5] = 10; }
  });

  document.addEventListener('mousemove', (e) => {
    const target = 1 - e.clientY / window.innerHeight;
    smoothOpenness += (Math.max(0, Math.min(1, target)) - smoothOpenness) * 0.3;
    // 键盘模式下鼠标也控制文字偏移
    smoothHandX += ((e.clientX / window.innerWidth) - smoothHandX) * 0.1;
    smoothHandY += ((1 - e.clientY / window.innerHeight) - smoothHandY) * 0.1;
  });

  document.addEventListener('touchmove', (e) => {
    const target = 1 - e.touches[0].clientY / window.innerHeight;
    smoothOpenness += (Math.max(0, Math.min(1, target)) - smoothOpenness) * 0.3;
  }, { passive: true });

  document.getElementById('hint').style.opacity = '1';
}

// ================================================================
// 7. 动态颜色 & 灯光计算（炫彩增强版）
// ================================================================
function updateParticleColors(gesture, openness, time) {
  const col = geometry.attributes.color.array;
  const G = gesture;

  for (let i = 0; i < CONFIG.particleCount; i++) {
    const i3 = i * 3;
    const phase = particlePhases[i];

    // 基础颜色不变，仅随张合度和呼吸脉冲调整亮度
    const baseR = baseColors[i3];
    const baseG = baseColors[i3 + 1];
    const baseB = baseColors[i3 + 2];

    if (G > 0) {
      const pulse = 0.75 + 0.25 * Math.sin(time * CONFIG.colorPulseSpeed + phase);
      const intensity = pulse * (0.75 + openness * 0.5);
      col[i3]     = Math.min(1, baseR * intensity * 1.3);
      col[i3 + 1] = Math.min(1, baseG * intensity * 0.9);
      col[i3 + 2] = Math.min(1, baseB * intensity * 0.8);
    } else {
      const pulse = 0.9 + 0.1 * Math.sin(time * 1.5 + phase);
      const intensity = (0.35 + openness * 0.7) * pulse;
      col[i3]     = baseR * intensity;
      col[i3 + 1] = baseG * intensity;
      col[i3 + 2] = baseB * intensity;
    }

    // 偶尔闪烁
    sparkleTimers[i] += 0.05;
    if (Math.sin(sparkleTimers[i] * 3 + phase) > 0.92 && Math.random() > 0.7) {
      col[i3]     = Math.min(1, col[i3] * 2.2);
      col[i3 + 1] = Math.min(1, col[i3 + 1] * 2.2);
      col[i3 + 2] = Math.min(1, col[i3 + 2] * 2.2);
    }
  }
  geometry.attributes.color.needsUpdate = true;

  const targetOpacity = G > 0 ? 0.95 : 0.6 + openness * 0.3;
  material.opacity += (targetOpacity - material.opacity) * 3 * 0.016;
}

function updateStarColors(gesture, openness, time) {
  const col = starsGeo.attributes.color.array;
  for (let i = 0; i < starsCount; i++) {
    const i3 = i * 3;
    const flicker = 0.7 + 0.3 * Math.sin(time * 3 + i * 1.7);
    let intensity;
    if (gesture > 0) {
      intensity = (0.6 + openness * 0.5) * flicker;
      col[i3] = starsBaseCol[i3] * intensity * 1.4;
      col[i3 + 1] = starsBaseCol[i3 + 1] * intensity * 1.0;
      col[i3 + 2] = starsBaseCol[i3 + 2] * intensity * 0.7;
    } else {
      intensity = (0.4 + openness * 0.6) * flicker;
      col[i3] = starsBaseCol[i3] * intensity;
      col[i3 + 1] = starsBaseCol[i3 + 1] * intensity;
      col[i3 + 2] = starsBaseCol[i3 + 2] * intensity;
    }
  }
  starsGeo.attributes.color.needsUpdate = true;
}

function updateAura(gesture, openness, time) {
  if (gesture > 0) {
    auraMat.opacity += (0.45 - auraMat.opacity) * 2 * 0.016;
  } else {
    auraMat.opacity += (0.15 + openness * 0.15 - auraMat.opacity) * 2 * 0.016;
  }
  aura.rotation.y += 0.003;
  aura.rotation.x += 0.002;

  // 环境光保持固定粉蓝调，随呼吸脉动
  const aCol = auraGeo.attributes.color.array;
  for (let i = 0; i < auraCount; i++) {
    const i3 = i * 3;
    const pulse = 0.85 + 0.15 * Math.sin(time * 1.8 + i * 0.7);
    const intensity = pulse * (0.5 + openness * 0.5);
    aCol[i3] = Math.min(1, baseAuraColors[i3] * intensity * (gesture > 0 ? 1.4 : 1));
    aCol[i3 + 1] = Math.min(1, baseAuraColors[i3 + 1] * intensity * (gesture > 0 ? 1.1 : 1));
    aCol[i3 + 2] = Math.min(1, baseAuraColors[i3 + 2] * intensity * 1.0);
  }
  auraGeo.attributes.color.needsUpdate = true;
}

// ================================================================
// 8. 计算目标位置（文字面向摄像头 + 跟随手部运动）
// ================================================================
function computeTargets(gesture, openness, time) {
  const targets = new Float32Array(CONFIG.particleCount * 3);

  // 手部位置映射到世界空间偏移（X: ±3, Y: ±2）
  const handOffsetX = (smoothHandX - 0.5) * 6.0;
  const handOffsetY = (smoothHandY - 0.5) * 4.0;
  // 深度影响扩散
  const depthFactor = 1 + smoothHandZ * 0.5;

  if (gesture >= 1 && gesture <= 5) {
    // 统一处理所有形状形态（文字 + 羽毛球 + 球拍 + 拥抱）
    let sourceTargets;
    if (gesture === 1) sourceTargets = loveTargets;
    else if (gesture === 2) sourceTargets = foreverTargets;
    else if (gesture === 3) sourceTargets = shuttlecockTargets;
    else if (gesture === 4) sourceTargets = racketTargets;
    else sourceTargets = hugTargets; // gesture === 5

    const spread = (0.65 + openness * 1.4) * depthFactor;
    for (let i = 0; i < CONFIG.particleCount; i++) {
      const t = sourceTargets[i];
      const wave = Math.sin(time * 1.8 + particlePhases[i]) * 0.025 * openness;
      targets[i * 3]     = t.x * CONFIG.textWidth * spread + handOffsetX + wave;
      targets[i * 3 + 1] = t.y * CONFIG.textHeight * spread + handOffsetY + wave * 0.7;
      targets[i * 3 + 2] = t.z * spread * 2 + smoothHandZ * 1.5;
    }
  } else {
    const radius = 1.2 + openness * 4.0;
    for (let i = 0; i < CONFIG.particleCount; i++) {
      const s = sphereBase[i];
      const drift = Math.sin(time * 1.3 + i * 0.03) * 0.15 * openness;
      const drift2 = Math.cos(time * 1.7 + i * 0.05) * 0.12 * openness;
      targets[i * 3]     = s.x * radius + drift;
      targets[i * 3 + 1] = s.y * radius + drift2;
      targets[i * 3 + 2] = s.z * radius + drift * 0.6;
    }
  }

  return targets;
}

// ================================================================
// 9. 动画循环
// ================================================================
const gestureLabel = document.getElementById('gesture-label');
const opennessBar = document.getElementById('openness-bar');
const hintEl = document.getElementById('hint');

function updateUI(gesture, openness) {
  const names = { 0: '散布形态', 1: '爱 你', 2: '永 远 爱 你', 3: '羽毛球', 4: '尤尼克斯', 5: '情侣拥抱' };
  gestureLabel.textContent = names[gesture] || '散布形态';
  gestureLabel.className = gesture > 0 ? 'active' : '';
  opennessBar.style.width = (openness * 100) + '%';
}

let lastTime = performance.now();
let timeAccum = 0;
let colorUpdateCounter = 0;

function animate(timestamp) {
  requestAnimationFrame(animate);

  let dt = (timestamp - lastTime) / 1000;
  if (dt <= 0 || dt > 0.2) dt = 0.016;
  lastTime = timestamp;
  timeAccum += dt;

  const targets = computeTargets(smoothGesture, smoothOpenness, timeAccum);

  const pos = geometry.attributes.position.array;
  for (let i = 0; i < pos.length; i++) {
    const pIdx = Math.floor(i / 3);
    const diff = targets[i] - pos[i];
    const dist = Math.abs(diff);
    const springFactor = (particleSpeeds[pIdx] + dist * 6.0) * dt;
    pos[i] += diff * Math.min(springFactor, 0.7);
  }
  geometry.attributes.position.needsUpdate = true;

  // 文字形态：面向摄像头，只做手部微调旋转
  if (smoothGesture > 0) {
    // 平滑回到正向（面向摄像头）
    const targetRotY = (smoothHandX - 0.5) * 1.0;  // 手左右移动微调 Y 旋转
    const targetRotX = (smoothHandY - 0.5) * 0.6;  // 手上下移动微调 X 旋转
    particles.rotation.y += (targetRotY - particles.rotation.y) * 0.08;
    particles.rotation.x += (targetRotX - particles.rotation.x) * 0.08;
    particles.rotation.z += (0 - particles.rotation.z) * 0.08;
  } else {
    // 散布形态：自由旋转
    particles.rotation.y += 0.0015;
    particles.rotation.x += Math.sin(timeAccum * 0.4) * 0.008;
    particles.rotation.z += Math.cos(timeAccum * 0.35) * 0.006;
  }

  colorUpdateCounter++;
  if (colorUpdateCounter >= 2) {
    colorUpdateCounter = 0;
    updateParticleColors(smoothGesture, smoothOpenness, timeAccum);
    updateStarColors(smoothGesture, smoothOpenness, timeAccum);
  }
  updateAura(smoothGesture, smoothOpenness, timeAccum);

  const targetSize = 0.08 + smoothOpenness * 0.04 + (smoothGesture > 0 ? 0.03 : 0);
  material.size += (targetSize - material.size) * 3 * dt;

  updateUI(smoothGesture, smoothOpenness);
  renderer.render(scene, camera);
}

// ================================================================
// 10. 音乐系统（Web Audio API 环境音乐 + 可选本地 MP3）
// ================================================================
let musicOn = false;
let audioCtx = null;
let ambientNodes = null;
let localAudio = null;
let localPlaylist = [];
let localTrackIdx = 0;

function createAmbientMusic() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  // 主音量
  const masterGain = ctx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(ctx.destination);

  // 混响（用延迟模拟）
  const delay = ctx.createDelay(0.4);
  delay.delayTime.value = 0.35;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.3;
  const delayDry = ctx.createGain();
  delayDry.gain.value = 0.7;
  const delayWet = ctx.createGain();
  delayWet.gain.value = 0.3;

  // 和弦进行（浪漫 C大调）
  const chords = [
    [261.63, 329.63, 392.00],  // C major
    [293.66, 369.99, 440.00],  // D minor
    [349.23, 440.00, 523.25],  // F major
    [392.00, 493.88, 587.33],  // G major
    [329.63, 392.00, 493.88],  // E minor
    [220.00, 261.63, 329.63],  // A minor
  ];

  let chordIdx = 0;
  let chordStartTime = ctx.currentTime;
  const oscillators = [];
  const lfos = [];

  function changeChord() {
    const chord = chords[chordIdx % chords.length];
    chordIdx++;

    // 渐变到新和弦
    const now = ctx.currentTime;
    chord.forEach((freq, idx) => {
      if (oscillators[idx]) {
        oscillators[idx].frequency.cancelScheduledValues(now);
        oscillators[idx].frequency.setTargetAtTime(freq, now, 0.5);
      }
    });

    chordStartTime = now;
  }

  // 创建 3 个振荡器（含泛音）
  for (let i = 0; i < 3; i++) {
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();

    osc.type = i === 0 ? 'sine' : i === 1 ? 'triangle' : 'sine';
    osc.frequency.value = chords[0][i];
    oscGain.gain.value = 0.06;

    // LFO 调制音量（颤音效果）
    lfo.type = 'sine';
    lfo.frequency.value = 0.2 + i * 0.15;
    lfoGain.gain.value = 0.02;

    lfo.connect(lfoGain);
    lfoGain.connect(oscGain.gain);
    osc.connect(oscGain);
    oscGain.connect(delayDry);
    oscGain.connect(delayWet);

    osc.start();
    lfo.start();

    oscillators.push(osc);
    lfos.push(lfo);
  }

  delayDry.connect(masterGain);
  delayWet.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(masterGain);

  // 和弦定时切换
  const chordInterval = setInterval(() => {
    if (ctx.state === 'closed') {
      clearInterval(chordInterval);
      return;
    }
    changeChord();
  }, 8000);

  return {
    ctx,
    masterGain,
    oscillators,
    lfos,
    chordInterval,
    fadeIn() {
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setTargetAtTime(0.12, now, 1.5);
    },
    fadeOut() {
      const now = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setTargetAtTime(0, now, 1.0);
    },
    destroy() {
      clearInterval(chordInterval);
      oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
      lfos.forEach(l => { try { l.stop(); } catch(e) {} });
      ctx.close();
    }
  };
}

// 尝试加载本地 MP3 文件
async function tryLoadLocalMusic() {
  const hint = document.getElementById('local-music-hint');
  // 尝试加载 musics/ 文件夹中的文件
  const testFiles = ['1.wav', '2.wav', '3.wav'];
  const found = [];

  for (const f of testFiles) {
    try {
      const resp = await fetch('musics/' + f, { method: 'HEAD' });
      if (resp.ok) found.push('musics/' + f);
    } catch (e) {
      // 文件不存在，跳过
    }
  }

  if (found.length > 0) {
    localPlaylist = found;
    hint.textContent = '本地音乐已就绪 (' + found.length + '首)';
    return true;
  } else {
    hint.textContent = '💡 将 MP3 放入 musics/ 文件夹即可播放';
    return false;
  }
}

function initMusic() {
  const btn = document.getElementById('music-btn');

  btn.addEventListener('click', async () => {
    musicOn = !musicOn;

    if (musicOn) {
      btn.classList.remove('off');

      // 优先使用本地 MP3
      if (localPlaylist.length > 0) {
        if (!localAudio) {
          localAudio = new Audio();
          localAudio.loop = false;
          localAudio.volume = 0.25;
          localAudio.addEventListener('ended', () => {
            localTrackIdx = (localTrackIdx + 1) % localPlaylist.length;
            localAudio.src = localPlaylist[localTrackIdx];
            localAudio.play().catch(() => {});
          });
        }
        localAudio.src = localPlaylist[localTrackIdx];
        localAudio.play().catch(() => {
          // 如果本地播放失败，回退到环境音乐
          initAmbientFallback();
        });
      } else {
        initAmbientFallback();
      }
    } else {
      btn.classList.add('off');
      if (ambientNodes) {
        ambientNodes.fadeOut();
      }
      if (localAudio) {
        localAudio.pause();
      }
    }
  });

  function initAmbientFallback() {
    if (!ambientNodes) {
      try {
        ambientNodes = createAmbientMusic();
      } catch (e) {
        console.warn('环境音乐初始化失败:', e);
        return;
      }
    }
    ambientNodes.fadeIn();
  }
}

// ================================================================
// 11. 启动
// ================================================================
async function main() {
  setupFallback();
  initMusic();
  tryLoadLocalMusic();

  hintEl.style.opacity = '0';

  const cameraReady = await initMediaPipe();
  useCamera = cameraReady;

  if (!cameraReady) {
    hintEl.style.opacity = '1';
  }

  const loading = document.getElementById('loading');
  loading.classList.add('hidden');
  setTimeout(() => loading.remove(), 700);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  requestAnimationFrame(animate);
}

main().catch((e) => {
  console.error('启动失败:', e);
  document.getElementById('loading-text').textContent = '加载失败，请刷新页面';
});
</script>
