<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>粒子之恋 - 3D Particle Love</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'LoveFont';
    src: local('Microsoft YaHei'), local('PingFang SC'), local('SimHei');
  }

  body {
    background: #050510; overflow: hidden;
    font-family: 'LoveFont', "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    height: 100dvh; width: 100dvw; touch-action: manipulation;
  }
  canvas { display: block; position: fixed; inset: 0; }

  /* 加载层 */
  #loading {
    position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse at center, #0a0a20 0%, #050510 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading-icon {
    width: 80px; height: 80px; margin-bottom: 24px;
    border-radius: 50%; position: relative;
  }
  #loading-icon::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, #ff6b9d, #6ba3ff, transparent);
    animation: spin 2s linear infinite;
  }
  #loading-icon::after {
    content: '♥'; position: absolute; inset: 4px; border-radius: 50%;
    background: #0a0a20; display: flex; align-items: center; justify-content: center;
    color: #ff6b9d; font-size: 2rem; line-height: 72px; text-align: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-text {
    color: #ff6b9d; font-size: 1.25rem; letter-spacing: 0.12em;
    animation: softPulse 2s ease-in-out infinite;
  }
  @keyframes softPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.97); }
  }
  #loading-sub { color: rgba(255,143,171,0.55); font-size: 0.78rem; margin-top: 10px; letter-spacing: 0.05em; }
  #loading-progress-wrap {
    width: 240px; height: 2px; background: rgba(255,255,255,0.08);
    border-radius: 1px; margin-top: 20px; overflow: hidden;
  }
  #loading-progress {
    height: 100%; width: 0%; border-radius: 1px;
    background: linear-gradient(90deg, #ff6b9d, #6ba3ff, #ffb3c6);
    transition: width 0.4s ease-out;
  }

  /* 底部状态栏 */
  #ui {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 20px 20px; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: linear-gradient(transparent, rgba(5,5,16,0.9) 50%);
  }
  #gesture-label {
    color: #fff; font-size: 1.05rem; letter-spacing: 0.1em; font-weight: 500;
    text-shadow: 0 0 18px rgba(255,107,157,0.5); transition: all 0.35s;
  }
  #gesture-label.active { color: #ff6b9d; font-size: 1.35rem; text-shadow: 0 0 24px rgba(255,107,157,0.7); }
  #shape-hint {
    color: rgba(255,255,255,0.3); font-size: 0.68rem; letter-spacing: 0.05em;
    transition: all 0.3s;
  }
  #openness-bar-wrap {
    width: 180px; height: 2px; background: rgba(255,255,255,0.1);
    border-radius: 1px; overflow: hidden;
  }
  #openness-bar {
    height: 100%; border-radius: 1px;
    background: linear-gradient(90deg, #ff6b9d, #6ba3ff, #ffb3c6);
    transition: width 0.2s ease-out;
  }

  /* 提示文字 */
  #hint {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(255,255,255,0.35); font-size: 0.7rem; letter-spacing: 0.04em;
    pointer-events: none; transition: opacity 0.6s;
    background: rgba(0,0,0,0.3); padding: 5px 14px; border-radius: 20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }

  /* 摄像头预览 */
  #video-preview {
    position: fixed; bottom: 16px; right: 12px; z-index: 12;
    width: 110px; height: 82px; border-radius: 10px; object-fit: cover;
    transform: scaleX(-1); opacity: 0.45; transition: opacity 0.4s;
    border: 1.5px solid rgba(255,107,157,0.3); pointer-events: none;
  }
  #video-preview:hover { opacity: 0.8; }

  /* 音乐按钮 */
  #music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid rgba(255,107,157,0.45);
    background: rgba(10,5,22,0.7); color: #ff6b9d;
    font-size: 1.05rem; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; letter-spacing: 0;
  }
  #music-btn:hover { border-color: #ff6b9d; box-shadow: 0 0 20px rgba(255,107,157,0.35); }
  #music-btn.on { background: rgba(255,107,157,0.15); }
  #music-btn.off { color: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.15); }

  /* QQ音乐播放器 */
  #music-player {
    position: fixed; bottom: 90px; right: 8px; z-index: 20;
    width: 300px; height: 66px; pointer-events: auto;
    border-radius: 12px; overflow: hidden; opacity: 0.88;
    border: 1px solid rgba(255,107,157,0.2);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #music-player.hidden { opacity: 0; pointer-events: none; transform: translateY(8px) scale(0.95); }
  #music-player iframe { width: 100%; height: 66px; border: none; border-radius: 12px; }
  #music-song-input {
    position: fixed; top: 62px; right: 16px; z-index: 20; pointer-events: auto;
    display: flex; gap: 6px; opacity: 0; transform: translateY(-4px);
    transition: all 0.3s; background: rgba(10,5,22,0.85);
    padding: 6px 8px; border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,107,157,0.25);
  }
  #music-song-input.show { opacity: 1; transform: translateY(0); }
  #music-song-input input {
    width: 160px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #fff; padding: 4px 10px; font-size: 0.75rem; outline: none;
  }
  #music-song-input input::placeholder { color: rgba(255,255,255,0.3); }
  #music-song-input button {
    background: rgba(255,107,157,0.25); border: none; border-radius: 6px;
    color: #ff6b9d; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
  }

  /* 响应式 */
  @media (max-width: 480px) {
    #gesture-label { font-size: 0.95rem; }
    #gesture-label.active { font-size: 1.2rem; }
    #music-player { width: 260px; right: 2px; }
    #video-preview { width: 80px; height: 60px; bottom: 10px; right: 6px; }
    #hint { font-size: 0.65rem; padding: 4px 10px; }
  }
</style>
</head>
<body>

<!-- 加载层 -->
<div id="loading">
  <div id="loading-icon"></div>
  <div id="loading-text">粒子之恋</div>
  <div id="loading-sub">正在初始化…</div>
  <div id="loading-progress-wrap"><div id="loading-progress"></div></div>
</div>

<!-- 音乐控制 -->
<button id="music-btn" class="off" title="QQ音乐">♪</button>
<div id="music-song-input">
  <input type="text" id="song-id-input" placeholder="QQ音乐歌曲ID">
  <button id="song-id-btn">播放</button>
</div>
<div id="music-player" class="hidden">
  <iframe id="music-iframe" allow="autoplay" loading="lazy"></iframe>
</div>

<!-- 摄像头 -->
<video id="input-video" autoplay playsinline muted style="display:none"></video>

<!-- 状态栏 -->
<div id="ui">
  <div id="gesture-label">粒子宇宙</div>
  <div id="shape-hint"></div>
  <div id="openness-bar-wrap"><div id="openness-bar" style="width:50%"></div></div>
</div>

<div id="hint">按 0-5 切换形态 · 鼠标控制张合</div>

<script src="js/three.min.js"></script>
<script src="js/camera_utils.js"></script>
<script src="js/hands.js"></script>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║              粒子之恋 — 3D Particle Love v2                ║
// ╚══════════════════════════════════════════════════════════════╝

const CONFIG = {
  particleCount: 10000,
  sphereRadius: 3,
  shapeScale: 5.8,
  transitionSpeed: 4.5,
  cameraZ: 9,
  opennessSmoothing: 0.45,
  landmarkSmoothing: 0.55,
  colorPulseSpeed: 2.5,
  modelLoadTimeout: 45,
  handFollowSpeed: 0.08,
  // QQ音乐默认歌曲ID（周杰伦 - 告白气球）
  defaultQQSongId: '102433286',
};

// ═══════════════════ Three.js 初始化 ═══════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 50);
camera.position.set(0, 0, CONFIG.cameraZ);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

// 发光粒子贴图
function createGlowTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.05, 'rgba(255,240,245,0.95)');
  g.addColorStop(0.18, 'rgba(255,150,190,0.7)');
  g.addColorStop(0.45, 'rgba(255,80,130,0.15)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

// 粉色+蓝调色板
const pinkBluePalette = [
  '#ff6b9d','#ff8fab','#ffb3c6','#ff477e','#ff3366','#ff7096',
  '#ffc2d1','#ff4081','#ff5e8a','#ff9f9f','#ffb8c6','#ffccd5',
  '#6ba3ff','#8fb3ff','#b3d4ff','#477eff','#6699ff','#c2d6ff',
  '#4080ff','#9fc5ff','#7ba8ff','#a3c4ff','#5b8def','#88a8ff',
  '#d47fff','#ff7bd4','#b37fff','#c48fff','#e090ff','#f090e0',
];

function paletteColor(hex) { return new THREE.Color(hex); }

// 粒子几何体
const geometry = new THREE.BufferGeometry();
const N = CONFIG.particleCount;
const positions = new Float32Array(N * 3);
const baseColors = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const baseColorIndices = new Uint16Array(N);

for (let i = 0; i < N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = CONFIG.sphereRadius * (0.6 + Math.random() * 0.4);
  positions[i*3]   = Math.sin(phi)*Math.cos(theta)*r;
  positions[i*3+1] = Math.sin(phi)*Math.sin(theta)*r;
  positions[i*3+2] = Math.cos(phi)*r;

  const ci = Math.floor(Math.random()*pinkBluePalette.length);
  baseColorIndices[i] = ci;
  const col = paletteColor(pinkBluePalette[ci]);
  baseColors[i*3]=col.r; baseColors[i*3+1]=col.g; baseColors[i*3+2]=col.b;
  colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  sizes[i] = 0.02 + Math.random()*0.08;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.10, map: createGlowTexture(), vertexColors: true,
  blending: THREE.AdditiveBlending, depthWrite: false,
  transparent: true, opacity: 0.85,
});
const particles = new THREE.Points(geometry, material);
scene.add(particles);

// 背景星场
const starsGeo = new THREE.BufferGeometry();
const starsCount = 1200;
const starsPos = new Float32Array(starsCount*3);
const starsBaseCol = new Float32Array(starsCount*3);
const starsCol = new Float32Array(starsCount*3);
for (let i=0;i<starsCount;i++) {
  starsPos[i*3]=(Math.random()-0.5)*30; starsPos[i*3+1]=(Math.random()-0.5)*20; starsPos[i*3+2]=-5-Math.random()*15;
  const col=paletteColor(pinkBluePalette[Math.floor(Math.random()*pinkBluePalette.length)]);
  const b=0.3+Math.random()*0.7;
  starsBaseCol[i*3]=col.r*b*0.5; starsBaseCol[i*3+1]=col.g*b*0.5; starsBaseCol[i*3+2]=col.b*b*0.5;
  starsCol[i*3]=starsBaseCol[i*3]; starsCol[i*3+1]=starsBaseCol[i*3+1]; starsCol[i*3+2]=starsBaseCol[i*3+2];
}
starsGeo.setAttribute('position',new THREE.BufferAttribute(starsPos,3));
starsGeo.setAttribute('color',new THREE.BufferAttribute(starsCol,3));
const starsMat=new THREE.PointsMaterial({size:0.025,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.55});
const stars=new THREE.Points(starsGeo,starsMat); scene.add(stars);

// 环境光点
const auraGeo=new THREE.BufferGeometry();
const auraCount=300;
const auraPos=new Float32Array(auraCount*3);
const auraColArr=new Float32Array(auraCount*3);
for (let i=0;i<auraCount;i++) {
  auraPos[i*3]=(Math.random()-0.5)*12; auraPos[i*3+1]=(Math.random()-0.5)*8; auraPos[i*3+2]=(Math.random()-0.5)*4;
  const col=paletteColor(pinkBluePalette[Math.floor(Math.random()*pinkBluePalette.length)]);
  auraColArr[i*3]=col.r; auraColArr[i*3+1]=col.g; auraColArr[i*3+2]=col.b;
}
auraGeo.setAttribute('position',new THREE.BufferAttribute(auraPos,3));
auraGeo.setAttribute('color',new THREE.BufferAttribute(auraColArr,3));
const auraMat=new THREE.PointsMaterial({size:0.06,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.25});
const aura=new THREE.Points(auraGeo,auraMat); scene.add(aura);
const baseAuraColors=new Float32Array(auraColArr);

// ═══════════════════ 形状采样 ═══════════════════

function samplePixels(canvas, count) {
  const ctx=canvas.getContext('2d');
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const px=[];
  for (let i=0;i<img.data.length;i+=4) {
    if (img.data[i+3]>60) px.push({x:(i/4)%canvas.width, y:Math.floor((i/4)/canvas.width)});
  }
  if (px.length<10) return Array.from({length:count},()=>({x:(Math.random()-0.5)*2,y:(Math.random()-0.5)*2,z:(Math.random()-0.5)*0.25}));
  const s=[];
  for (let i=0;i<count;i++) {
    const p=px[Math.floor(Math.random()*px.length)];
    s.push({x:(p.x/canvas.width-0.5)*2, y:-(p.y/canvas.height-0.5)*2, z:(Math.random()-0.5)*0.25});
  }
  return s;
}

// --- 文字采样 ---
function sampleText(text,fontSize,cw,ch,count) {
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.font=`bold ${fontSize}px "Microsoft YaHei","PingFang SC","SimHei",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,cw/2,ch/2);
  return samplePixels(c,count);
}

// --- 羽毛球（按实物比例：球头1/4，羽毛裙3/4，底部宽度≈3×球头宽）---
function drawShuttlecock(canvas) {
  const ctx=canvas.getContext('2d'), w=canvas.width, h=canvas.height, cx=w/2;
  ctx.fillStyle='#ffffff';

  // 球头 — 半球（实际是软木半球体）
  const corkR=40, corkTop=52;
  ctx.beginPath(); ctx.arc(cx,corkTop+corkR,corkR,Math.PI,0); ctx.fill();
  // 球头底部横带
  ctx.fillRect(cx-corkR,corkTop+corkR-4,corkR*2,14);

  // 羽毛裙身 — 梯形，从球头底部到接近画布底部
  const skirtTop=corkTop+corkR+10, skirtBottom=h-24;
  const topHalf=corkR, bottomHalf=98;
  ctx.beginPath();
  ctx.moveTo(cx-topHalf,skirtTop);
  ctx.lineTo(cx-bottomHalf,skirtBottom);
  ctx.lineTo(cx+bottomHalf,skirtBottom);
  ctx.lineTo(cx+topHalf,skirtTop);
  ctx.fill();

  // 羽毛纹理 — 中央粗线 + 两侧细线
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(cx,skirtTop+4); ctx.lineTo(cx,skirtBottom-4); ctx.stroke();
  ctx.lineWidth=2.5;
  for (let i=1;i<=3;i++) {
    const off=i*18;
    ctx.beginPath(); ctx.moveTo(cx-off*0.6,skirtTop+8); ctx.lineTo(cx-off,skirtBottom-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+off*0.6,skirtTop+8); ctx.lineTo(cx+off,skirtBottom-6); ctx.stroke();
  }
  // 横纹
  ctx.lineWidth=1.5;
  for (let j=0;j<4;j++) {
    const y=skirtTop+20+j*42;
    const halfW=topHalf+(bottomHalf-topHalf)*((y-skirtTop)/(skirtBottom-skirtTop));
    ctx.beginPath(); ctx.moveTo(cx-halfW+8,y); ctx.lineTo(cx+halfW-8,y); ctx.stroke();
  }
}

// --- 尤尼克斯羽毛球拍（椭圆拍头+网线+细杆+缠带手柄）---
function drawRacket(canvas) {
  const ctx=canvas.getContext('2d'), w=canvas.width, h=canvas.height, cx=w/2;

  // 拍头椭圆 — 实际拍头是椭圆形，高>宽
  const headCx=cx, headCy=125, headRx=82, headRy=112;
  ctx.fillStyle='#ffffff'; ctx.strokeStyle='#ffffff';

  // 拍框（粗线）
  ctx.lineWidth=12;
  ctx.beginPath(); ctx.ellipse(headCx,headCy,headRx,headRy,0,0,Math.PI*2); ctx.stroke();

  // 内框
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(headCx,headCy,headRx-8,headRy-8,0,0,Math.PI*2); ctx.stroke();

  // 竖线
  for (let i=-6;i<=6;i++) {
    ctx.beginPath();
    const x=headCx+i*(headRx-10)/6;
    const yRange=Math.sqrt(1-Math.pow((x-headCx)/headRx,2))*headRy;
    ctx.moveTo(x,headCy-yRange+8); ctx.lineTo(x,headCy+yRange-8); ctx.stroke();
  }
  // 横线
  for (let j=-5;j<=5;j++) {
    ctx.beginPath();
    const y=headCy+j*(headRy-10)/5;
    const xRange=Math.sqrt(1-Math.pow((y-headCy)/headRy,2))*headRx;
    ctx.moveTo(headCx-xRange+8,y); ctx.lineTo(headCx+xRange-8,y); ctx.stroke();
  }

  // 拍杆 — 细长直线
  ctx.lineWidth=9;
  ctx.beginPath(); ctx.moveTo(cx,headCy+headRy+4); ctx.lineTo(cx,355); ctx.stroke();

  // T型接头
  ctx.fillRect(cx-16,headCy+headRy-4,32,22);

  // 拍柄 — 较宽
  const handleTop=355, handleH=108;
  ctx.fillRect(cx-22,handleTop,44,handleH);

  // 柄部缠带纹
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.8;
  for (let k=0;k<7;k++) {
    const y=handleTop+8+k*15;
    ctx.beginPath(); ctx.moveTo(cx-20,y); ctx.lineTo(cx+20,y+2); ctx.stroke();
  }
  // 柄底盖
  ctx.fillRect(cx-26,handleTop+handleH-4,52,10);
}

// --- 情侣拥抱（双人面对面、环抱、中间爱心）---
function drawHuggingCouple(canvas) {
  const ctx=canvas.getContext('2d'), w=canvas.width, h=canvas.height, cx=w/2;
  ctx.fillStyle='#ffffff'; ctx.strokeStyle='#ffffff';

  // 女性（左）头部略小略高
  ctx.beginPath(); ctx.arc(cx-60,58,30,0,Math.PI*2); ctx.fill();
  // 男性（右）头部略大略低
  ctx.beginPath(); ctx.arc(cx+58,64,32,0,Math.PI*2); ctx.fill();

  // 中间爱心
  ctx.beginPath();
  const hx=cx, hy=82;
  ctx.moveTo(hx,hy+20);
  ctx.bezierCurveTo(hx-28,hy-6,hx-14,hy-32,hx,hy-10);
  ctx.bezierCurveTo(hx+14,hy-32,hx+28,hy-6,hx,hy+20);
  ctx.fill();

  // 女性身体 — 从左到中间
  ctx.beginPath();
  ctx.moveTo(cx-88,95);
  ctx.bezierCurveTo(cx-70,150,cx-40,200,cx-15,h-18);
  ctx.lineTo(cx-50,h-18);
  ctx.bezierCurveTo(cx-75,210,cx-95,160,cx-100,95);
  ctx.fill();

  // 男性身体 — 从右到中间
  ctx.beginPath();
  ctx.moveTo(cx+82,94);
  ctx.bezierCurveTo(cx+65,148,cx+35,198,cx+12,h-14);
  ctx.lineTo(cx+52,h-14);
  ctx.bezierCurveTo(cx+78,208,cx+98,158,cx+102,94);
  ctx.fill();

  // 女性手臂环抱男性
  ctx.lineWidth=20; ctx.lineCap='round';
  ctx.beginPath();
  ctx.arc(cx-8,130,72,0.25*Math.PI,1.0*Math.PI);
  ctx.stroke();
  // 男性手臂环抱女性
  ctx.beginPath();
  ctx.arc(cx+8,128,70,-0.85*Math.PI,-0.05*Math.PI);
  ctx.stroke();

  // 裙摆（女性下方）
  ctx.lineWidth=1; ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx-50,h-18);
  ctx.lineTo(cx-72,h-6);
  ctx.lineTo(cx-45,h-6);
  ctx.fill();
}

// 生成所有采样
const loveTargets = sampleText('爱你', 160, 900, 220, N);
const foreverTargets = sampleText('永远爱你', 110, 1000, 220, N);

function genShapeTargets(drawFn, cw, ch, count) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  drawFn(c);
  return samplePixels(c, count);
}
const shuttlecockTargets = genShapeTargets(drawShuttlecock, 440, 500, N);
const racketTargets = genShapeTargets(drawRacket, 380, 520, N);
const hugTargets = genShapeTargets(drawHuggingCouple, 480, 420, N);

// Fibonacci 球面
function fibonacciSphere(count) {
  const pts=[], phi=Math.PI*(3-Math.sqrt(5));
  for (let i=0;i<count;i++) {
    const y=1-(i/(count-1))*2, r=Math.sqrt(1-y*y), theta=phi*i;
    pts.push({x:Math.cos(theta)*r, y, z:Math.sin(theta)*r});
  }
  return pts;
}
const sphereBase=fibonacciSphere(N);

const particleSpeeds=new Float32Array(N);
const particlePhases=new Float32Array(N);
const sparkleTimers=new Float32Array(N);
for (let i=0;i<N;i++) {
  particleSpeeds[i]=CONFIG.transitionSpeed*(0.4+Math.random()*1.2);
  particlePhases[i]=Math.random()*Math.PI*2;
  sparkleTimers[i]=Math.random()*100;
}

// ═══════════════════ 手势系统 ═══════════════════
let smoothGesture=0, smoothOpenness=0.5, handDetected=false, useCamera=false;
let handCenterX=0.5, handCenterY=0.5;
let smoothHandX=0.5, smoothHandY=0.5, smoothHandZ=0;
const gestureVotes=[0,0,0,0,0,0];
const VOTE_DECAY=0.75, VOTE_THRESHOLD=2.5;
let smoothedLandmarks=null;

function smoothLandmarks(raw) {
  if (!smoothedLandmarks||smoothedLandmarks.length!==raw.length) {smoothedLandmarks=raw.map(l=>({...l})); return smoothedLandmarks;}
  const a=CONFIG.landmarkSmoothing;
  for (let i=0;i<raw.length;i++) {smoothedLandmarks[i].x+=(raw[i].x-smoothedLandmarks[i].x)*a; smoothedLandmarks[i].y+=(raw[i].y-smoothedLandmarks[i].y)*a; smoothedLandmarks[i].z+=(raw[i].z-smoothedLandmarks[i].z)*a;}
  return smoothedLandmarks;
}

function detectGesture(lm) {
  const fingers=[{t:8,p:6},{t:12,p:10},{t:16,p:14},{t:20,p:18}];
  const ext=fingers.map(f=>lm[f.t].y<lm[f.p].y-0.015);
  const cnt=ext.filter(Boolean).length;
  const thumbExt=lm[4].x<lm[3].x-0.02;
  if (cnt===1&&ext[0]) return 1;
  if (cnt===2&&ext[0]&&ext[1]) return 2;
  if (cnt===3&&ext[0]&&ext[1]&&ext[2]) return 3;
  if (cnt===4&&ext[0]&&ext[1]&&ext[2]&&ext[3]) return thumbExt?5:4;
  return 0;
}

function calcOpenness(lm) {
  return Math.max(0,Math.min(1,(Math.hypot(lm[4].x-lm[20].x,lm[4].y-lm[20].y,lm[4].z-lm[20].z)-0.08)/0.32));
}

function updateGestureVote(raw) {
  for (let i=0;i<6;i++) gestureVotes[i]*=VOTE_DECAY;
  gestureVotes[raw]+=1.2;
  const mx=Math.max(...gestureVotes), mg=gestureVotes.indexOf(mx);
  if (mg!==smoothGesture&&mx>=VOTE_THRESHOLD) {smoothGesture=mg; for(let i=0;i<6;i++)gestureVotes[i]=0; gestureVotes[mg]=VOTE_THRESHOLD;}
  if (smoothGesture>0&&gestureVotes[smoothGesture]<1.0&&mx<1.5) {smoothGesture=0; for(let i=0;i<6;i++)gestureVotes[i]=0;}
}

function onHandResults(results) {
  if (results.multiHandLandmarks&&results.multiHandLandmarks.length>0) {
    handDetected=true;
    const lm=smoothLandmarks(results.multiHandLandmarks[0]);
    updateGestureVote(detectGesture(lm));
    smoothOpenness+=(calcOpenness(lm)-smoothOpenness)*CONFIG.opennessSmoothing;
    handCenterX=(lm[0].x+lm[9].x)/2; handCenterY=(lm[0].y+lm[9].y)/2;
    smoothHandZ+=(((lm[4].z+lm[8].z)/2)-smoothHandZ)*0.3;
  } else {
    handDetected=false;
    if (!useCamera) return;
    smoothOpenness+=(0.5-smoothOpenness)*0.05;
    for (let i=0;i<6;i++) gestureVotes[i]*=0.8;
    if (Math.max(...gestureVotes)<1.5) smoothGesture=0;
    handCenterX=0.5; handCenterY=0.5;
  }
  const f=CONFIG.handFollowSpeed;
  smoothHandX+=(handCenterX-smoothHandX)*f;
  smoothHandY+=(handCenterY-smoothHandY)*f;
}

// ═══════════════════ 动画 ═══════════════════
function computeTargets(gesture,openness,time) {
  const targets=new Float32Array(N*3);
  const hx=(smoothHandX-0.5)*6.0, hy=(smoothHandY-0.5)*4.0;
  const df=1+smoothHandZ*0.5;

  let src;
  if (gesture===1) src=loveTargets;
  else if (gesture===2) src=foreverTargets;
  else if (gesture===3) src=shuttlecockTargets;
  else if (gesture===4) src=racketTargets;
  else if (gesture===5) src=hugTargets;
  else src=null;

  if (src) {
    const spread=(0.65+openness*1.4)*df;
    for (let i=0;i<N;i++) {
      const t=src[i];
      const w=Math.sin(time*1.8+particlePhases[i])*0.025*openness;
      targets[i*3]=t.x*CONFIG.shapeScale*spread+hx+w;
      targets[i*3+1]=t.y*CONFIG.shapeScale*spread+hy+w*0.7;
      targets[i*3+2]=t.z*spread*2+smoothHandZ*1.5;
    }
  } else {
    const radius=1.2+openness*4.0;
    for (let i=0;i<N;i++) {
      const s=sphereBase[i];
      const d1=Math.sin(time*1.3+i*0.03)*0.15*openness;
      const d2=Math.cos(time*1.7+i*0.05)*0.12*openness;
      targets[i*3]=s.x*radius+d1;
      targets[i*3+1]=s.y*radius+d2;
      targets[i*3+2]=s.z*radius+d1*0.6;
    }
  }
  return targets;
}

function updateColors(gesture,openness,time) {
  const col=geometry.attributes.color.array;
  for (let i=0;i<N;i++) {
    const i3=i*3, ph=particlePhases[i];
    const br=baseColors[i3], bg=baseColors[i3+1], bb=baseColors[i3+2];
    let intensity;
    if (gesture>0) {
      const pulse=0.75+0.25*Math.sin(time*CONFIG.colorPulseSpeed+ph);
      intensity=pulse*(0.75+openness*0.5);
      col[i3]=Math.min(1,br*intensity*1.3);
      col[i3+1]=Math.min(1,bg*intensity*0.9);
      col[i3+2]=Math.min(1,bb*intensity*0.8);
    } else {
      const pulse=0.9+0.1*Math.sin(time*1.5+ph);
      intensity=(0.35+openness*0.7)*pulse;
      col[i3]=br*intensity; col[i3+1]=bg*intensity; col[i3+2]=bb*intensity;
    }
    sparkleTimers[i]+=0.05;
    if (Math.sin(sparkleTimers[i]*3+ph)>0.92&&Math.random()>0.7) {
      col[i3]=Math.min(1,col[i3]*2.2); col[i3+1]=Math.min(1,col[i3+1]*2.2); col[i3+2]=Math.min(1,col[i3+2]*2.2);
    }
  }
  geometry.attributes.color.needsUpdate=true;
  material.opacity+=(gesture>0?0.95:0.6+openness*0.3-material.opacity)*3*0.016;
}

function updateStars(gesture,openness,time) {
  const col=starsGeo.attributes.color.array;
  for (let i=0;i<starsCount;i++) {
    const i3=i*3,fl=0.7+0.3*Math.sin(time*3+i*1.7);
    const intensity=(gesture>0?(0.6+openness*0.5):(0.4+openness*0.6))*fl;
    col[i3]=starsBaseCol[i3]*intensity*(gesture>0?1.4:1);
    col[i3+1]=starsBaseCol[i3+1]*intensity*(gesture>0?1.0:1);
    col[i3+2]=starsBaseCol[i3+2]*intensity*(gesture>0?0.7:1);
  }
  starsGeo.attributes.color.needsUpdate=true;
}

function updateAura(gesture,openness,time) {
  auraMat.opacity+=(gesture>0?0.45:0.15+openness*0.15-auraMat.opacity)*2*0.016;
  aura.rotation.y+=0.003; aura.rotation.x+=0.002;
  const aCol=auraGeo.attributes.color.array;
  for (let i=0;i<auraCount;i++) {
    const i3=i*3, pulse=0.85+0.15*Math.sin(time*1.8+i*0.7);
    const intensity=pulse*(0.5+openness*0.5);
    aCol[i3]=Math.min(1,baseAuraColors[i3]*intensity*(gesture>0?1.4:1));
    aCol[i3+1]=Math.min(1,baseAuraColors[i3+1]*intensity*(gesture>0?1.1:1));
    aCol[i3+2]=Math.min(1,baseAuraColors[i3+2]*intensity);
  }
  auraGeo.attributes.color.needsUpdate=true;
}

// UI
const gestureLabel=document.getElementById('gesture-label');
const shapeHint=document.getElementById('shape-hint');
const opennessBar=document.getElementById('openness-bar');
const hintEl=document.getElementById('hint');
const names={0:'粒子宇宙',1:'爱 你',2:'永 远 爱 你',3:'羽毛球',4:'尤尼克斯球拍',5:'情侣拥抱'};
const hints={0:'',1:'伸出食指',2:'伸出食指+中指',3:'伸出三指',4:'伸出四指',5:'张开五指'};

function updateUI(gesture,openness) {
  gestureLabel.textContent=names[gesture]||'粒子宇宙';
  gestureLabel.className=gesture>0?'active':'';
  shapeHint.textContent=hints[gesture]||'';
  if (!useCamera) shapeHint.textContent='';
  opennessBar.style.width=(openness*100)+'%';
}

let lastTime=performance.now(), timeAccum=0, colorUpdateCounter=0;

function animate(timestamp) {
  requestAnimationFrame(animate);
  let dt=(timestamp-lastTime)/1000;
  if (dt<=0||dt>0.2) dt=0.016;
  lastTime=timestamp; timeAccum+=dt;

  const targets=computeTargets(smoothGesture,smoothOpenness,timeAccum);
  const pos=geometry.attributes.position.array;
  for (let i=0;i<pos.length;i++) {
    const pIdx=Math.floor(i/3);
    const diff=targets[i]-pos[i];
    pos[i]+=diff*Math.min((particleSpeeds[pIdx]+Math.abs(diff)*6.0)*dt,0.7);
  }
  geometry.attributes.position.needsUpdate=true;

  // 形态>0：面向摄像头 + 手部微调；形态=0：自由旋转
  if (smoothGesture>0) {
    const trY=(smoothHandX-0.5)*1.0, trX=(smoothHandY-0.5)*0.6;
    particles.rotation.y+=(trY-particles.rotation.y)*0.08;
    particles.rotation.x+=(trX-particles.rotation.x)*0.08;
    particles.rotation.z+=(0-particles.rotation.z)*0.08;
  } else {
    particles.rotation.y+=0.0015;
    particles.rotation.x+=Math.sin(timeAccum*0.4)*0.008;
    particles.rotation.z+=Math.cos(timeAccum*0.35)*0.006;
  }

  colorUpdateCounter++;
  if (colorUpdateCounter>=2) {colorUpdateCounter=0; updateColors(smoothGesture,smoothOpenness,timeAccum); updateStars(smoothGesture,smoothOpenness,timeAccum);}
  updateAura(smoothGesture,smoothOpenness,timeAccum);

  const tSize=0.08+smoothOpenness*0.04+(smoothGesture>0?0.03:0);
  material.size+=(tSize-material.size)*3*dt;

  updateUI(smoothGesture,smoothOpenness);
  renderer.render(scene,camera);
}

// ═══════════════════ 键盘/鼠标后备 ═══════════════════
function setupFallback() {
  document.addEventListener('keydown',(e)=>{
    const k=parseInt(e.key);
    if (k>=0&&k<=5) {smoothGesture=k; for(let i=0;i<6;i++)gestureVotes[i]=0; gestureVotes[k]=10;}
  });
  document.addEventListener('mousemove',(e)=>{
    smoothOpenness+=(Math.max(0,Math.min(1,1-e.clientY/window.innerHeight))-smoothOpenness)*0.3;
    smoothHandX+=((e.clientX/window.innerWidth)-smoothHandX)*0.1;
    smoothHandY+=((1-e.clientY/window.innerHeight)-smoothHandY)*0.1;
  });
  document.addEventListener('touchmove',(e)=>{
    smoothOpenness+=(Math.max(0,Math.min(1,1-e.touches[0].clientY/window.innerHeight))-smoothOpenness)*0.3;
  },{passive:true});
  hintEl.style.opacity='1';
}

// ═══════════════════ QQ音乐 ═══════════════════
let musicOn=false, musicInited=false;
function initMusic() {
  const btn=document.getElementById('music-btn');
  const player=document.getElementById('music-player');
  const iframe=document.getElementById('music-iframe');
  const inputWrap=document.getElementById('music-song-input');
  const songInput=document.getElementById('song-id-input');
  const songBtn=document.getElementById('song-id-btn');
  let songId=CONFIG.defaultQQSongId;

  function loadPlayer(id) {
    songId=id;
    iframe.src=`https://i.y.qq.com/n2/m/outchain/player/index.html?songid=${id}&songtype=0&autoplay=1`;
    musicInited=true;
  }

  btn.addEventListener('click',()=>{
    musicOn=!musicOn;
    if (musicOn) {
      btn.classList.add('on'); btn.classList.remove('off');
      btn.textContent='♪';
      if (!musicInited) loadPlayer(songId);
      player.classList.remove('hidden');
      inputWrap.classList.add('show');
      if (musicInited) { iframe.src=iframe.src; } // 重新加载触发播放
    } else {
      btn.classList.remove('on'); btn.classList.add('off');
      btn.textContent='♪';
      player.classList.add('hidden');
      inputWrap.classList.remove('show');
    }
  });

  // 双击音乐按钮显示/隐藏输入框
  btn.addEventListener('dblclick',()=>{
    inputWrap.classList.toggle('show');
  });

  songBtn.addEventListener('click',()=>{
    const id=songInput.value.trim();
    if (id) loadPlayer(id);
  });
  songInput.addEventListener('keydown',(e)=>{
    if (e.key==='Enter') {const id=songInput.value.trim(); if(id)loadPlayer(id);}
  });
}

// ═══════════════════ 手势初始化 ═══════════════════
let cameraStream=null, animFrameId=null;

function stopCamera() {
  if (animFrameId) {cancelAnimationFrame(animFrameId); animFrameId=null;}
  if (cameraStream) {cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null;}
}

async function initMediaPipe() {
  const loadingText=document.getElementById('loading-text');
  const loadingSub=document.getElementById('loading-sub');
  const progressBar=document.getElementById('loading-progress');

  if (typeof Hands==='undefined') {
    loadingText.textContent='手势库未加载'; loadingSub.textContent='使用键盘模式：按 0-5 切换形态';
    progressBar.style.width='100%'; return false;
  }

  loadingText.textContent='正在初始化…';
  loadingSub.textContent='请求摄像头 + 加载AI模型（约18MB）';

  let progress=0;
  const progressTimer=setInterval(()=>{
    progress+=Math.random()*5; if (progress>85) progress=85;
    progressBar.style.width=progress+'%';
  },500);

  const hands=new Hands({locateFile:(f)=>`models/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.4,selfieMode:true});
  hands.onResults(onHandResults);

  const video=document.getElementById('input-video');

  try {
    // 获取摄像头
    let stream;
    try {
      stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    } catch(camErr) {
      console.warn('摄像头:',camErr.message);
      clearInterval(progressTimer); progressBar.style.width='100%';
      loadingText.textContent='摄像头不可用'; loadingSub.textContent='使用键盘模式';
      return false;
    }
    cameraStream=stream; video.srcObject=stream; await video.play();

    const preview=document.createElement('video');
    preview.id='video-preview'; preview.srcObject=stream;
    preview.autoplay=true; preview.playsInline=true; preview.muted=true;
    document.body.appendChild(preview);

    // 帧循环（第一次send触发模型自动加载）
    loadingSub.textContent='加载AI模型中…';
    let modelReady=false, timedOut=false;
    const loadTimeout=setTimeout(()=>{
      if (!modelReady) {timedOut=true; clearInterval(progressTimer); progressBar.style.width='100%';
        loadingText.textContent='模型加载超时'; loadingSub.textContent='使用键盘模式，模型后台继续加载';}
    },CONFIG.modelLoadTimeout*1000);

    function frame() {
      if (!cameraStream||timedOut) return;
      hands.send({image:video}).then(()=>{
        if (!modelReady) {modelReady=true; clearTimeout(loadTimeout); clearInterval(progressTimer); progressBar.style.width='100%';}
        if (cameraStream) animFrameId=requestAnimationFrame(frame);
      }).catch(()=>{if(cameraStream)animFrameId=requestAnimationFrame(frame);});
    }
    animFrameId=requestAnimationFrame(frame);

    await new Promise(r=>setTimeout(r,2000));
    return !timedOut;
  } catch(e) {
    console.warn('初始化失败:',e.message);
    stopCamera(); clearInterval(progressTimer); progressBar.style.width='100%';
    loadingText.textContent='初始化失败'; loadingSub.textContent='使用键盘模式';
    return false;
  }
}

// ═══════════════════ 启动 ═══════════════════
async function main() {
  setupFallback();
  initMusic();

  const cameraReady=await initMediaPipe();
  useCamera=cameraReady;
  if (!cameraReady) hintEl.style.opacity='1';

  const loading=document.getElementById('loading');
  loading.classList.add('hidden');
  setTimeout(()=>loading.remove(),800);

  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });

  requestAnimationFrame(animate);
}

main().catch(e=>{
  console.error('启动失败:',e);
  document.getElementById('loading-text').textContent='加载失败，请刷新页面';
});
</script>
